server:
  port: 8081

spring:
  application:
    name: identity-service
  config:
    # Tìm .env dù chạy từ thư mục identity-service hay từ thư mục gốc của project
    import:
      - optional:file:.env[.properties]
      - optional:file:./identity-service/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000 # 15 mins
    refresh-token-expiration: 604800000 # 7 days
