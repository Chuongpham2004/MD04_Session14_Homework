server:
  port: 8080

spring:
  application:
    name: gateway-service
  config:
    # Tìm .env dù chạy từ thư mục gateway-service hay từ thư mục gốc của project
    import:
      - optional:file:.env[.properties]
      - optional:file:./gateway-service/.env[.properties]
  data:
    # Dùng chung Redis với Identity-Service để đọc được blacklist
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**
            - id: product-service
              uri: lb://product-service
              predicates:
                - Path=/api/products/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

app:
  jwt:
    # Phải trùng với secret của Identity-Service để verify được chữ ký
    secret: ${JWT_SECRET}
